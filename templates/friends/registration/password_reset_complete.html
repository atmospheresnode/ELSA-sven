{% extends "friends/auth_base.html" %}

{% block auth_title %}Password changed{% endblock %}

{% block auth_body %}
<div class="text-center">
    <div class="auth-mark"><i class="bi bi-check2-circle" style="font-size: 2rem;" aria-hidden="true"></i></div>
    <p class="text-muted mb-4" style="font-size: 0.9375rem;">
        Your new password is set. Any other device that was signed in has been signed out,
        and remembered devices will ask for an emailed code again.
    </p>
    <a href="{% url 'main:index' %}" class="btn-elsa d-block text-decoration-none">Sign in</a>
</div>
{% endblock %}
