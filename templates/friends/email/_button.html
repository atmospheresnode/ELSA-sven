<tr>
  <td style="padding:24px 32px 8px;" align="center">
    <a href="{{ href }}" style="display:inline-block;background-color:#008080;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;padding:12px 28px;border-radius:6px;">{{ label }}</a>
    <p style="margin:14px 0 0;font-size:12px;color:#888888;line-height:1.5;">Or paste this address into your browser:<br><span style="word-break:break-all;color:#1f8a7f;">{{ href }}</span></p>
    {% if note %}<p style="margin:10px 0 0;font-size:13px;color:#888888;">{{ note }}</p>{% endif %}
  </td>
</tr>
